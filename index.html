<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Analytics Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; margin-bottom: 30px; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric-card { 
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .metric-title { font-size: 0.875rem; color: #e2e8f0; margin-bottom: 10px; }
        .metric-value { font-size: 2rem; font-weight: bold; }
        .chart-container { 
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        select {
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 20px;
            cursor: pointer;
        }
        canvas {
            max-width: 100%;
            height: 300px !important;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background: #1e293b;
            font-weight: 600;
            color: #94a3b8;
        }
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .spinner {
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #7f1d1d;
            border: 1px solid #dc2626;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: #1e293b;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 8px;
            font-size: 1rem;
        }
        .tab.active {
            background: #3b82f6;
            color: white;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 20px;">Loading data...</p>
        </div>
    </div>

    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <script>
        let allData = null;
        let selectedStock = 'all';
        let activeTab = 'overview';
        let charts = {};

        async function loadData() {
            try {
                const files = [
                    { key: 'fkq', name: 'ratios_for_ml.csv', fallback: 'FKQ.csv' },
                    { key: 'combined', name: 'combined_financial_predictions.csv' },
                    { key: 'debt', name: 'debt_to_equity_predictions.csv' },
                    { key: 'roe', name: 'financial_kpi_predictions.csv' }
                ];

                const loaded = {};

                for (const file of files) {
                    try {
                        const response = await fetch(file.name);
                        if (!response.ok) throw new Error('Not found');
                        const text = await response.text();
                        const parsed = Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true });
                        loaded[file.key] = parsed.data;
                    } catch (e) {
                        if (file.fallback) {
                            const response = await fetch(file.fallback);
                            if (!response.ok) throw new Error(`Cannot find ${file.name} or ${file.fallback}`);
                            const text = await response.text();
                            const parsed = Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true });
                            loaded[file.key] = parsed.data;
                        } else {
                            throw new Error(`Cannot find ${file.name}`);
                        }
                    }
                }

                allData = {
                    fkq: loaded.fkq.filter(d => d.stock),
                    combined: loaded.combined.filter(d => d.stock),
                    debt: loaded.debt,
                    roe: loaded.roe
                };

                render();
            } catch (error) {
                document.getElementById('app').innerHTML = `
                    <div class="container">
                        <div class="error">
                            <h2>Error Loading Data</h2>
                            <p style="margin-top: 10px;">${error.message}</p>
                            <p style="margin-top: 15px;">Make sure these files are in your repo root:</p>
                            <ul style="margin-left: 20px; margin-top: 10px;">
                                <li>ratios_for_ml.csv (or FKQ.csv)</li>
                                <li>combined_financial_predictions.csv</li>
                                <li>debt_to_equity_predictions.csv</li>
                                <li>financial_kpi_predictions.csv</li>
                            </ul>
                            <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer;">Retry</button>
                        </div>
                    </div>
                `;
            }
        }

        function calculateMetrics(data) {
            const avgROE = data.reduce((sum, d) => sum + (d.roe || 0), 0) / data.length;
            const avgDebt = data.reduce((sum, d) => sum + (d.debt_to_equity || 0), 0) / data.length;
            const avgCurrentRatio = data.reduce((sum, d) => sum + (d.current_ratio || 0), 0) / data.length;
            
            return {
                avgROE: (avgROE * 100).toFixed(2),
                avgDebt: avgDebt.toFixed(2),
                avgCurrentRatio: avgCurrentRatio.toFixed(2)
            };
        }

        function destroyCharts() {
            Object.values(charts).forEach(chart => {
                if (chart) chart.destroy();
            });
            charts = {};
        }

        function createCharts(filteredData) {
            destroyCharts();

            // Time Series Chart - Uses FKQ/ratios_for_ml data
            const timeData = filteredData
                .sort((a, b) => new Date(a.enddate) - new Date(b.enddate))
                .slice(0, 50);

            const ctx1 = document.getElementById('timeSeriesChart');
            if (ctx1) {
                charts.timeSeries = new Chart(ctx1, {
                    type: 'line',
                    data: {
                        labels: timeData.map(d => d.enddate),
                        datasets: [{
                            label: 'ROE',
                            data: timeData.map(d => d.roe * 100),
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4
                        }, {
                            label: 'Debt/Equity',
                            data: timeData.map(d => d.debt_to_equity),
                            borderColor: '#a855f7',
                            backgroundColor: 'rgba(168, 85, 247, 0.1)',
                            tension: 0.4
                        }, {
                            label: 'Current Ratio',
                            data: timeData.map(d => d.current_ratio),
                            borderColor: '#22c55e',
                            backgroundColor: 'rgba(34, 197, 94, 0.1)',
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } }
                        },
                        scales: {
                            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                        }
                    }
                });
            }

            // ROE Distribution - Uses FKQ/ratios_for_ml data
            const roeData = filteredData.slice(0, 30);
            const ctx2 = document.getElementById('roeChart');
            if (ctx2) {
                charts.roe = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: roeData.map(d => d.stock),
                        datasets: [{
                            label: 'ROE (%)',
                            data: roeData.map(d => d.roe * 100),
                            backgroundColor: roeData.map(d => d.roe > 0 ? '#22c55e' : '#ef4444')
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } }
                        },
                        scales: {
                            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                        }
                    }
                });
            }

            // Debt to Equity - Uses FKQ/ratios_for_ml data
            const ctx3 = document.getElementById('debtChart');
            if (ctx3) {
                charts.debt = new Chart(ctx3, {
                    type: 'bar',
                    data: {
                        labels: roeData.map(d => d.stock),
                        datasets: [{
                            label: 'Debt/Equity Ratio',
                            data: roeData.map(d => d.debt_to_equity),
                            backgroundColor: '#a855f7'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } }
                        },
                        scales: {
                            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                        }
                    }
                });
            }

            // Asset Composition - Uses FKQ/ratios_for_ml data
            const assetData = filteredData.slice(0, 20);
            const ctx4 = document.getElementById('assetChart');
            if (ctx4) {
                charts.assets = new Chart(ctx4, {
                    type: 'bar',
                    data: {
                        labels: assetData.map(d => d.stock),
                        datasets: [{
                            label: 'Cash ($M)',
                            data: assetData.map(d => d.cash / 1000000),
                            backgroundColor: '#22c55e'
                        }, {
                            label: 'Inventory ($M)',
                            data: assetData.map(d => d.inventory / 1000000),
                            backgroundColor: '#3b82f6'
                        }, {
                            label: 'Receivables ($M)',
                            data: assetData.map(d => d.netreceivables / 1000000),
                            backgroundColor: '#a855f7'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return context.dataset.label + ': $' + context.parsed.y.toFixed(1) + 'M';
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { stacked: true, ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#334155' } },
                            y: { stacked: true, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                        }
                    }
                });
            }

            // NEW: Actual vs Predicted Comparison - Uses combined_financial_predictions
            const ctx5 = document.getElementById('comparisonChart');
            if (ctx5) {
                const compData = allData.combined.slice(0, 20);
                charts.comparison = new Chart(ctx5, {
                    type: 'bar',
                    data: {
                        labels: compData.map(d => d.stock),
                        datasets: [{
                            label: 'Actual ROE',
                            data: compData.map(d => d.Actual_ROE),
                            backgroundColor: '#3b82f6'
                        }, {
                            label: 'Predicted ROE',
                            data: compData.map(d => d.Predicted_ROE),
                            backgroundColor: '#22c55e'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } },
                            title: {
                                display: true,
                                text: 'Model Predictions vs Actual ROE',
                                color: '#94a3b8'
                            }
                        },
                        scales: {
                            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                        }
                    }
                });
            }

            // Prediction Accuracy Scatter - ROE - Uses financial_kpi_predictions
            const ctx6 = document.getElementById('predictionROEChart');
            if (ctx6) {
                charts.predROE = new Chart(ctx6, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: 'ROE Predictions',
                            data: allData.roe.slice(0, 100).map(d => ({
                                x: d.Actual_ROE,
                                y: d.Predicted_ROE
                            })),
                            backgroundColor: '#3b82f6'
                        }, {
                            label: 'Perfect Prediction',
                            data: [{x: -5, y: -5}, {x: 5, y: 5}],
                            type: 'line',
                            borderColor: '#ef4444',
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } }
                        },
                        scales: {
                            x: { 
                                title: { display: true, text: 'Actual ROE', color: '#94a3b8' },
                                ticks: { color: '#94a3b8' }, 
                                grid: { color: '#334155' } 
                            },
                            y: { 
                                title: { display: true, text: 'Predicted ROE', color: '#94a3b8' },
                                ticks: { color: '#94a3b8' }, 
                                grid: { color: '#334155' } 
                            }
                        }
                    }
                });
            }

            // Prediction Accuracy Scatter - Debt - Uses debt_to_equity_predictions
            const ctx7 = document.getElementById('predictionDebtChart');
            if (ctx7) {
                charts.predDebt = new Chart(ctx7, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: 'Debt/Equity Predictions',
                            data: allData.debt.slice(0, 100).map(d => ({
                                x: d.Actual_Debt_to_Equity,
                                y: d.Predicted_Debt_to_Equity
                            })),
                            backgroundColor: '#a855f7'
                        }, {
                            label: 'Perfect Prediction',
                            data: [{x: 0, y: 0}, {x: 15, y: 15}],
                            type: 'line',
                            borderColor: '#ef4444',
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } }
                        },
                        scales: {
                            x: { 
                                title: { display: true, text: 'Actual Debt/Equity', color: '#94a3b8' },
                                ticks: { color: '#94a3b8' }, 
                                grid: { color: '#334155' } 
                            },
                            y: { 
                                title: { display: true, text: 'Predicted Debt/Equity', color: '#94a3b8' },
                                ticks: { color: '#94a3b8' }, 
                                grid: { color: '#334155' } 
                            }
                        }
                    }
                });
            }

            // NEW: Prediction Error Distribution - Uses combined_financial_predictions
            const ctx8 = document.getElementById('errorDistChart');
            if (ctx8) {
                const errors = allData.combined.map(d => Math.abs(d.Actual_ROE - d.Predicted_ROE));
                const errorBuckets = [0, 0.5, 1, 1.5, 2, 2.5];
                const errorCounts = errorBuckets.map((bucket, i) => {
                    if (i === errorBuckets.length - 1) return 0;
                    return errors.filter(e => e >= bucket && e < errorBuckets[i + 1]).length;
                });

                charts.errorDist = new Chart(ctx8, {
                    type: 'bar',
                    data: {
                        labels: ['0-0.5', '0.5-1.0', '1.0-1.5', '1.5-2.0', '2.0-2.5'],
                        datasets: [{
                            label: 'Number of Predictions',
                            data: errorCounts,
                            backgroundColor: ['#22c55e', '#84cc16', '#eab308', '#f97316', '#ef4444']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } },
                            title: {
                                display: true,
                                text: 'ROE Prediction Error Distribution',
                                color: '#94a3b8'
                            }
                        },
                        scales: {
                            x: { 
                                title: { display: true, text: 'Absolute Error Range', color: '#94a3b8' },
                                ticks: { color: '#94a3b8' }, 
                                grid: { color: '#334155' } 
                            },
                            y: { 
                                title: { display: true, text: 'Count', color: '#94a3b8' },
                                ticks: { color: '#94a3b8' }, 
                                grid: { color: '#334155' } 
                            }
                        }
                    }
                });
            }
        }

        function render() {
            const stocks = ['all', ...new Set(allData.fkq.map(d => d.stock))].sort();
            const filteredData = selectedStock === 'all' 
                ? allData.fkq 
                : allData.fkq.filter(d => d.stock === selectedStock);

            const metrics = calculateMetrics(filteredData);
            const roeMAE = allData.roe.reduce((sum, d) => sum + Math.abs(d.Actual_ROE - d.Predicted_ROE), 0) / allData.roe.length;
            const debtMAE = allData.debt.reduce((sum, d) => sum + Math.abs(d.Actual_Debt_to_Equity - d.Predicted_Debt_to_Equity), 0) / allData.debt.length;

            let content = `
                <div class="container">
                    <h1>📊 Financial Analytics Dashboard</h1>
                    <p class="subtitle">Analyzing ${stocks.length - 1} stocks | ${filteredData.length} data points | ${allData.combined.length} predictions</p>

                    <select onchange="selectedStock = this.value; render();">
                        ${stocks.map(s => `<option value="${s}" ${s === selectedStock ? 'selected' : ''}>${s === 'all' ? 'All Stocks' : s}</option>`).join('')}
                    </select>

                    <div class="tabs">
                        <button class="tab ${activeTab === 'overview' ? 'active' : ''}" onclick="activeTab = 'overview'; render();">Overview</button>
                        <button class="tab ${activeTab === 'predictions' ? 'active' : ''}" onclick="activeTab = 'predictions'; render();">ML Predictions</button>
                        <button class="tab ${activeTab === 'assets' ? 'active' : ''}" onclick="activeTab = 'assets'; render();">Assets & Ratios</button>
                    </div>

                    <div class="metrics">
                        <div class="metric-card" style="background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);">
                            <div class="metric-title">Average ROE</div>
                            <div class="metric-value">${metrics.avgROE}%</div>
                        </div>
                        <div class="metric-card" style="background: linear-gradient(135deg, #6b21a8 0%, #a855f7 100%);">
                            <div class="metric-title">Avg Debt/Equity</div>
                            <div class="metric-value">${metrics.avgDebt}</div>
                        </div>
                        <div class="metric-card" style="background: linear-gradient(135deg, #15803d 0%, #22c55e 100%);">
                            <div class="metric-title">Avg Current Ratio</div>
                            <div class="metric-value">${metrics.avgCurrentRatio}</div>
                        </div>
                        <div class="metric-card" style="background: linear-gradient(135deg, #c2410c 0%, #f97316 100%);">
                            <div class="metric-title">ROE Prediction MAE</div>
                            <div class="metric-value">${roeMAE.toFixed(3)}</div>
                        </div>
                    </div>
            `;

            if (activeTab === 'overview') {
                content += `
                    <div class="chart-container">
                        <h2 style="margin-bottom: 15px;">📈 Financial Metrics Over Time</h2>
                        <canvas id="timeSeriesChart"></canvas>
                    </div>

                    <div class="chart-grid">
                        <div class="chart-container">
                            <h2 style="margin-bottom: 15px;">💰 ROE Distribution</h2>
                            <canvas id="roeChart"></canvas>
                        </div>
                        <div class="chart-container">
                            <h2 style="margin-bottom: 15px;">📊 Debt to Equity Analysis</h2>
                            <canvas id="debtChart"></canvas>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'predictions') {
                content += `
                    <div class="chart-container">
                        <h2 style="margin-bottom: 15px;">🎯 Model Performance Metrics</h2>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px;">
                            <div style="background: #334155; padding: 20px; border-radius: 8px;">
                                <div style="color: #94a3b8; font-size: 0.875rem;">ROE MAE</div>
                                <div style="color: #3b82f6; font-size: 1.5rem; font-weight: bold;">${roeMAE.toFixed(4)}</div>
                                <div style="color: #64748b; font-size: 0.75rem; margin-top: 5px;">Mean Absolute Error</div>
                            </div>
                            <div style="background: #334155; padding: 20px; border-radius: 8px;">
                                <div style="color: #94a3b8; font-size: 0.875rem;">Debt/Equity MAE</div>
                                <div style="color: #a855f7; font-size: 1.5rem; font-weight: bold;">${debtMAE.toFixed(4)}</div>
                                <div style="color: #64748b; font-size: 0.75rem; margin-top: 5px;">Mean Absolute Error</div>
                            </div>
                            <div style="background: #334155; padding: 20px; border-radius: 8px;">
                                <div style="color: #94a3b8; font-size: 0.875rem;">Total Predictions</div>
                                <div style="color: #22c55e; font-size: 1.5rem; font-weight: bold;">${allData.combined.length}</div>
                                <div style="color: #64748b; font-size: 0.75rem; margin-top: 5px;">Data Points</div>
                            </div>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h2 style="margin-bottom: 15px;">📊 Actual vs Predicted Comparison</h2>
                        <canvas id="comparisonChart"></canvas>
                    </div>

                    <div class="chart-grid">
                        <div class="chart-container">
                            <h2 style="margin-bottom: 15px;">🎯 ROE: Actual vs Predicted</h2>
                            <canvas id="predictionROEChart"></canvas>
                        </div>
                        <div class="chart-container">
                            <h2 style="margin-bottom: 15px;">🎯 Debt/Equity: Actual vs Predicted</h2>
                            <canvas id="predictionDebtChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h2 style="margin-bottom: 15px;">📉 Prediction Error Distribution</h2>
                        <canvas id="errorDistChart"></canvas>
                    </div>

                    <div class="chart-container">
                        <h2 style="margin-bottom: 15px;">⚠️ Top 10 Prediction Errors</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Stock</th>
                                    <th>Date</th>
                                    <th>Actual ROE</th>
                                    <th>Predicted ROE</th>
                                    <th>Absolute Error</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${allData.combined
                                    .map(d => ({...d, error: Math.abs(d.Actual_ROE - d.Predicted_ROE)}))
                                    .sort((a, b) => b.error - a.error)
                                    .slice(0, 10)
