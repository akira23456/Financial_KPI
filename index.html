<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Analytics Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; margin-bottom: 30px; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric-card { 
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .metric-title { font-size: 0.875rem; color: #e2e8f0; margin-bottom: 10px; }
        .metric-value { font-size: 2rem; font-weight: bold; }
        .chart-container { 
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        select {
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 20px;
            cursor: pointer;
        }
        canvas {
            max-width: 100%;
            height: 300px !important;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background: #1e293b;
            font-weight: 600;
            color: #94a3b8;
        }
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .spinner {
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #7f1d1d;
            border: 1px solid #dc2626;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: #1e293b;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 8px;
            font-size: 1rem;
        }
        .tab.active {
            background: #3b82f6;
            color: white;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 20px;">Loading financial data...</p>
            <p style="margin-top: 10px; font-size: 14px; color: #64748b;">Check browser console (F12) if this takes too long</p>
        </div>
    </div>

    <script>
        console.log('Dashboard starting...');
        console.log('Papa:', typeof Papa);
        console.log('Chart:', typeof Chart);

        let allData = null;
        let selectedStock = 'all';
        let activeTab = 'overview';
        let charts = {};

        // Simple CSV parser fallback
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const row = {};
                headers.forEach((header, index) => {
                    const value = values[index] ? values[index].trim() : '';
                    // Try to convert to number
                    row[header] = isNaN(value) ? value : parseFloat(value);
                });
                data.push(row);
            }
            
            return { data };
        }

        async function loadData() {
            try {
                console.log('Starting data load...');
                
                const files = [
                    { key: 'fkq', name: 'ratios_for_ml.csv', fallback: 'FKQ.csv' },
                    { key: 'combined', name: 'combined_financial_predictions.csv' },
                    { key: 'debt', name: 'debt_to_equity_predictions.csv' },
                    { key: 'roe', name: 'financial_kpi_predictions.csv' }
                ];

                const loaded = {};

                for (const file of files) {
                    console.log(`Loading ${file.name}...`);
                    try {
                        const response = await fetch(file.name);
                        if (!response.ok) throw new Error('Not found');
                        const text = await response.text();
                        console.log(`Loaded ${file.name}, parsing...`);
                        
                        // Use Papa if available, otherwise use simple parser
                        const parsed = typeof Papa !== 'undefined' 
                            ? Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true })
                            : parseCSV(text);
                        
                        loaded[file.key] = parsed.data;
                        console.log(`✓ ${file.name}: ${parsed.data.length} rows`);
                    } catch (e) {
                        if (file.fallback) {
                            console.log(`Trying fallback ${file.fallback}...`);
                            const response = await fetch(file.fallback);
                            if (!response.ok) throw new Error(`Cannot find ${file.name} or ${file.fallback}`);
                            const text = await response.text();
                            const parsed = typeof Papa !== 'undefined'
                                ? Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true })
                                : parseCSV(text);
                            loaded[file.key] = parsed.data;
                            console.log(`✓ ${file.fallback}: ${parsed.data.length} rows`);
                        } else {
                            throw new Error(`Cannot find ${file.name}`);
                        }
                    }
                }

                allData = {
                    fkq: loaded.fkq.filter(d => d.stock),
                    combined: loaded.combined.filter(d => d.stock),
                    debt: loaded.debt,
                    roe: loaded.roe
                };

                console.log('All data loaded successfully!');
                console.log('FKQ:', allData.fkq.length);
                console.log('Combined:', allData.combined.length);
                console.log('Debt:', allData.debt.length);
                console.log('ROE:', allData.roe.length);

                render();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('app').innerHTML = `
                    <div class="container">
                        <div class="error">
                            <h2>❌ Error Loading Data</h2>
                            <p style="margin-top: 10px;"><strong>${error.message}</strong></p>
                            <p style="margin-top: 15px;">Make sure these files are uploaded to your repo root:</p>
                            <ul style="margin-left: 20px; margin-top: 10px;">
                                <li>ratios_for_ml.csv (or FKQ.csv)</li>
                                <li>combined_financial_predictions.csv</li>
                                <li>debt_to_equity_predictions.csv</li>
                                <li>financial_kpi_predictions.csv</li>
                            </ul>
                            <p style="margin-top: 15px; color: #94a3b8;">Current URL: ${window.location.href}</p>
                            <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer;">Retry</button>
                        </div>
                    </div>
                `;
            }
        }

        function calculateMetrics(data) {
            const avgROE = data.reduce((sum, d) => sum + (d.roe || 0), 0) / data.length;
            const avgDebt = data.reduce((sum, d) => sum + (d.debt_to_equity || 0), 0) / data.length;
            const avgCurrentRatio = data.reduce((sum, d) => sum + (d.current_ratio || 0), 0) / data.length;
            
            return {
                avgROE: (avgROE * 100).toFixed(2),
                avgDebt: avgDebt.toFixed(2),
                avgCurrentRatio: avgCurrentRatio.toFixed(2)
            };
        }

        function destroyCharts() {
            Object.values(charts).forEach(chart => {
                if (chart) chart.destroy();
            });
            charts = {};
        }

        function createCharts(filteredData) {
            if (typeof Chart === 'undefined') {
                console.error('Chart.js not loaded');
                return;
            }

            destroyCharts();

            // Only create charts for current tab
            if (activeTab === 'overview') {
                createOverviewCharts(filteredData);
            } else if (activeTab === 'predictions') {
                createPredictionCharts();
            } else if (activeTab === 'assets') {
                createAssetCharts(filteredData);
            }
        }

        function createOverviewCharts(filteredData) {
            // Time Series
            const timeData = filteredData
                .sort((a, b) => new Date(a.enddate) - new Date(b.enddate))
                .slice(0, 50);

            const ctx1 = document.getElementById('timeSeriesChart');
            if (ctx1) {
                charts.timeSeries = new Chart(ctx1, {
                    type: 'line',
                    data: {
                        labels: timeData.map(d => d.enddate),
                        datasets: [{
                            label: 'ROE (%)',
                            data: timeData.map(d => (d.roe || 0) * 100),
                            borderColor: '#3b82f6',
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#94a3b8' } } },
                        scales: {
                            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                        }
                    }
                });
            }

            // ROE Bar
            const roeData = filteredData.slice(0, 30);
            const ctx2 = document.getElementById('roeChart');
            if (ctx2) {
                charts.roe = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: roeData.map(d => d.stock),
                        datasets: [{
                            label: 'ROE (%)',
                            data: roeData.map(d => (d.roe || 0) * 100),
                            backgroundColor: roeData.map(d => d.roe > 0 ? '#22c55e' : '#ef4444')
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#94a3b8' } } },
                        scales: {
                            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                        }
                    }
                });
            }
        }

        function createPredictionCharts() {
            // Prediction scatter
            const ctx = document.getElementById('predictionROEChart');
            if (ctx && allData.roe) {
                charts.predROE = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: 'ROE Predictions',
                            data: allData.roe.slice(0, 100).map(d => ({
                                x: d.Actual_ROE,
                                y: d.Predicted_ROE
                            })),
                            backgroundColor: '#3b82f6'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#94a3b8' } } },
                        scales: {
                            x: { 
                                title: { display: true, text: 'Actual ROE', color: '#94a3b8' },
                                ticks: { color: '#94a3b8' }, 
                                grid: { color: '#334155' } 
                            },
                            y: { 
                                title: { display: true, text: 'Predicted ROE', color: '#94a3b8' },
                                ticks: { color: '#94a3b8' }, 
                                grid: { color: '#334155' } 
                            }
                        }
                    }
                });
            }
        }

        function createAssetCharts(filteredData) {
            const assetData = filteredData.slice(0, 20);
            const ctx = document.getElementById('assetChart');
            if (ctx) {
                charts.assets = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: assetData.map(d => d.stock),
                        datasets: [{
                            label: 'Cash ($M)',
                            data: assetData.map(d => (d.cash || 0) / 1000000),
                            backgroundColor: '#22c55e'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#94a3b8' } } },
                        scales: {
                            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                        }
                    }
                });
            }
        }

        function render() {
            const stocks = ['all', ...new Set(allData.fkq.map(d => d.stock))].sort();
            const filteredData = selectedStock === 'all' 
                ? allData.fkq 
                : allData.fkq.filter(d => d.stock === selectedStock);

            const metrics = calculateMetrics(filteredData);

            let content = `
                <div class="container">
                    <h1>📊 Financial Analytics Dashboard</h1>
                    <p class="subtitle">Analyzing ${stocks.length - 1} stocks with ${filteredData.length} data points</p>

                    <select onchange="selectedStock = this.value; render();">
                        ${stocks.map(s => `<option value="${s}" ${s === selectedStock ? 'selected' : ''}>${s === 'all' ? 'All Stocks' : s}</option>`).join('')}
                    </select>

                    <div class="tabs">
                        <button class="tab ${activeTab === 'overview' ? 'active' : ''}" onclick="activeTab = 'overview'; render();">Overview</button>
                        <button class="tab ${activeTab === 'predictions' ? 'active' : ''}" onclick="activeTab = 'predictions'; render();">Predictions</button>
                        <button class="tab ${activeTab === 'assets' ? 'active' : ''}" onclick="activeTab = 'assets'; render();">Assets</button>
                    </div>

                    <div class="metrics">
                        <div class="metric-card" style="background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);">
                            <div class="metric-title">Average ROE</div>
                            <div class="metric-value">${metrics.avgROE}%</div>
                        </div>
                        <div class="metric-card" style="background: linear-gradient(135deg, #6b21a8 0%, #a855f7 100%);">
                            <div class="metric-title">Avg Debt/Equity</div>
                            <div class="metric-value">${metrics.avgDebt}</div>
                        </div>
                        <div class="metric-card" style="background: linear-gradient(135deg, #15803d 0%, #22c55e 100%);">
                            <div class="metric-title">Avg Current Ratio</div>
                            <div class="metric-value">${metrics.avgCurrentRatio}</div>
                        </div>
                        <div class="metric-card" style="background: linear-gradient(135deg, #c2410c 0%, #f97316 100%);">
                            <div class="metric-title">Total Stocks</div>
                            <div class="metric-value">${stocks.length - 1}</div>
                        </div>
                    </div>
            `;

            if (activeTab === 'overview') {
                content += `
                    <div class="chart-container">
                        <h2 style="margin-bottom: 15px;">Financial Metrics Over Time</h2>
                        <canvas id="timeSeriesChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h2 style="margin-bottom: 15px;">ROE Distribution</h2>
                        <canvas id="roeChart"></canvas>
                    </div>
                `;
            } else if (activeTab === 'predictions') {
                content += `
                    <div class="chart-container">
                        <h2 style="margin-bottom: 15px;">ROE: Actual vs Predicted</h2>
                        <canvas id="predictionROEChart"></canvas>
                    </div>
                `;
            } else if (activeTab === 'assets') {
                content += `
                    <div class="chart-container">
                        <h2 style="margin-bottom: 15px;">Asset Composition</h2>
                        <canvas id="assetChart"></canvas>
                    </div>
                `;
            }

            content += '</div>';
            document.getElementById('app').innerHTML = content;

            setTimeout(() => createCharts(filteredData), 100);
        }

        // Start loading when page is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadData);
        } else {
            loadData();
        }
    </script>
</body>
</html>
