    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.13/html-to-image.min.js" integrity="sha512-iZ2ORl595Wx6miw+GuadDet4WQbdSWS3JLMoNfY8cRGoEFy6oT3G9IbcrBeL6AfkgpA51ETt/faX6yLV+/gFJg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
      (function() {
        const originalConsole = window.console;
        window.console = {
          log: (...args) => {
            originalConsole.log(...args);
            window.parent.postMessage({ type: 'console', message: args.join(' ') }, '*');
          },
          error: (...args) => {
            originalConsole.error(...args);
            window.parent.postMessage({ type: 'console', message: 'Error: ' + args.join(' ') }, '*');
          },
          warn: (...args) => {
            originalConsole.warn(...args);
            window.parent.postMessage({ type: 'console', message: 'Warning: ' + args.join(' ') }, '*');
          }
        };

        let requestId = 0;
        let callbacksMap = new Map();
        let streamControllers = new Map();
        
        window.claude = {
          complete: (prompt) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'claudeComplete', id, prompt }, '*');
            });
          }
        };

        window.storage = {
          get: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageGet', id, key, shared }, '*');
            });
          },
          set: (key, value, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageSet', id, key, value, shared }, '*');
            });
          },
          delete: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageDelete', id, key, shared }, '*');
            });
          },
          list: (prefix, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageList', id, prefix, shared }, '*');
            });
          }
        };

        let pendingBlobs = new Map();
        URL.createObjectURL = (blob) => {
          // Store the blob and create an ID and URL for it
          const blobId = `blob-${Date.now()}-${Math.random()}`;
          pendingBlobs.set(blobId, blob);
          return `blob-request://${blobId}`;
        };

        URL.revokeObjectURL = (url) => {
          // Remove the blob from our store
          const blobId = url.replace("blob-request://", "");
          pendingBlobs.delete(blobId);
        };

        const getBlobFromURL = (url) => {
          const blobId = url.replace("blob-request://", "");
          return pendingBlobs.get(blobId);
        };

        // Override global fetch with streaming support
        window.fetch = (url, init = {}) => {
          return new Promise((resolve, reject) => {
            const id = requestId++;
            const channelId = `fetch-${id}-${Date.now()}`;
            
            callbacksMap.set(id, { 
              resolve: (response) => {
                // Create a ReadableStream for the response body
                const stream = new ReadableStream({
                  start(controller) {
                    streamControllers.set(channelId, controller);
                  },
                  cancel() {
                    streamControllers.delete(channelId);
                  }
                });
                
                // Create and return the Response with the stream
                resolve(new Response(stream, {
                  status: response.status,
                  statusText: response.statusText,
                  headers: response.headers
                }));
              },
              reject,
              channelId
            });
            
            window.parent.postMessage({
              type: 'proxyFetch',
              id,
              url,
              init,
              channelId
            }, '*');
          });
        };

        window.addEventListener('message', async (event) => {
          if (event.data.type === 'takeScreenshot') {
            const rootElement = document.getElementById('artifacts-component-root-html');
            if (!rootElement) {
              window.parent.postMessage({
                type: 'screenshotError',
                error: new Error('Root element not found'),
              }, '*');
            }
            const screenshot = await htmlToImage.toPng(rootElement, {
              imagePlaceholder:
                "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAA1JREFUGFdjePDgwX8ACOQDoNsk0PMAAAAASUVORK5CYII=",
            });
            window.parent.postMessage({
              type: 'screenshotData',
              data: screenshot,
            }, '*');
          } else if (event.data.type === 'claudeComplete') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.completion);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'proxyFetchResponse') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
              callbacksMap.delete(event.data.id);
            } else {
              // Initial response with headers, status, etc.
              callback.resolve({
                status: event.data.status,
                statusText: event.data.statusText,
                headers: event.data.headers
              });
              // Don't delete the callback yet if streaming
              if (!event.data.body) {
                callbacksMap.delete(event.data.id);
              }
            }
          } else if (event.data.type === 'proxyFetchStream') {
            // Handle streaming data chunks
            const controller = streamControllers.get(event.data.channelId);
            if (controller) {
              if (event.data.error) {
                controller.error(new Error(event.data.error));
                streamControllers.delete(event.data.channelId);
              } else if (event.data.done) {
                controller.close();
                streamControllers.delete(event.data.channelId);
                // Clean up the callback
                const callback = Array.from(callbacksMap.entries()).find(
                  ([_, value]) => value.channelId === event.data.channelId
                );
                if (callback) {
                  callbacksMap.delete(callback[0]);
                }
              } else if (event.data.chunk) {
                controller.enqueue(new Uint8Array(event.data.chunk));
              }
            }
          } else if (event.data.type === 'storageGet') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageSet') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageDelete') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageList') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          }
        });

        window.addEventListener('click', (event) => {
          const isEl = event.target instanceof HTMLElement;
          if (!isEl) return;
    
          // find ancestor links
          const linkEl = event.target.closest("a");
          if (!linkEl || !linkEl.href) return;
    
          event.preventDefault();
          event.stopImmediatePropagation();
    
          if (linkEl.href.startsWith("blob-request:")) {
            const blob = getBlobFromURL(linkEl.href);
            if (!blob) return;
            void blob.arrayBuffer().then((data) => {
              window.parent.postMessage({
                type: "downloadFile",
                filename: linkEl.download,
                data,
                mimeType: blob.type || "application/octet-stream",
              });
            });
          } else if (linkEl.href.startsWith("data:")) {
            const [header, base64Data] = linkEl.href.split(",");
            const mimeMatch = header.match(/data:([^;]+)/);
            const mimeType = mimeMatch ? mimeMatch[1] : "application/octet-stream";
            const binaryString = atob(base64Data);
            const data = Uint8Array.from(binaryString, (c) =>
              c.charCodeAt(0),
            ).buffer;
            window.parent.postMessage({
              type: "downloadFile",
              filename: linkEl.download,
              data,
              mimeType,
            });
          } else {
            let linkUrl;
            try {
              linkUrl = new URL(linkEl.href);
            } catch (error) {
              return;
            }
    
            if (linkUrl.hostname === window.location.hostname) return;
      
            window.parent.postMessage({
              type: 'openExternal',
              href: linkEl.href,
            }, '*');
          }
      });

        const originalOpen = window.open;
        window.open = function (url) {
          window.parent.postMessage({
            type: "openExternal",
            href: url,
          }, "*");
        };

        window.addEventListener('error', (event) => {
          window.parent.postMessage({ type: 'console', message: 'Uncaught Error: ' + event.message }, '*');
        });
      })();
    </script>

    <script type="text/babel">

        function FinancialDashboard() {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [missingFiles, setMissingFiles] = useState([]);
            const [selectedStock, setSelectedStock] = useState('all');
            const [activeTab, setActiveTab] = useState('overview');

            useEffect(() => {
                loadData();
            }, []);

            const loadData = async () => {
                try {
                    const missing = [];
                    let loadedData = {};

                    const loadCSV = async (filename) => {
                        const response = await fetch(`data/${filename}`);
                        if (!response.ok) throw new Error(`File not found: ${filename}`);
                        const text = await response.text();
                        return Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true });
                    };

                    try {
                        const parsed = await loadCSV('ratios_for_ml.csv');
                        loadedData.fkq = parsed.data.filter(d => d.stock);
                    } catch (e) {
                        try {
                            const parsed = await loadCSV('FKQ.csv');
                            loadedData.fkq = parsed.data.filter(d => d.stock);
                        } catch (e2) {
                            missing.push('FKQ.csv or ratios_for_ml.csv');
                        }
                    }

                    try {
                        const parsed = await loadCSV('combined_financial_predictions.csv');
                        loadedData.combined = parsed.data.filter(d => d.stock);
                    } catch (e) {
                        missing.push('combined_financial_predictions.csv');
                        loadedData.combined = [];
                    }

                    try {
                        const parsed = await loadCSV('debt_to_equity_predictions.csv');
                        loadedData.debt = parsed.data.filter(d => d.Actual_Debt_to_Equity != null);
                    } catch (e) {
                        missing.push('debt_to_equity_predictions.csv');
                        loadedData.debt = [];
                    }

                    try {
                        const parsed = await loadCSV('financial_kpi_predictions.csv');
                        loadedData.roe = parsed.data.filter(d => d.Actual_ROE != null);
                    } catch (e) {
                        missing.push('financial_kpi_predictions.csv');
                        loadedData.roe = [];
                    }

                    setMissingFiles(missing);
                    setData(loadedData);
                    setLoading(false);
                } catch (err) {
                    console.error('Error loading data:', err);
                    setLoading(false);
                }
            };

            if (loading) {
                return (
                    <div className="flex items-center justify-center h-screen bg-slate-900">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-16 w-16 border-b-2 border-blue-500 mx-auto"></div>
                            <p className="mt-4 text-slate-300">Loading financial data...</p>
                        </div>
                    </div>
                );
            }

            if (!data || !data.fkq) {
                return (
                    <div className="flex items-center justify-center h-screen bg-slate-900">
                        <div className="text-center max-w-md bg-slate-800 p-8 rounded-xl">
                            <div className="mx-auto text-red-500 mb-4"><Upload size={64} /></div>
                            <h2 className="text-2xl font-bold text-white mb-4">Missing Required Files</h2>
                            <p className="text-slate-300 mb-4">Please place CSV files in the 'data' folder</p>
                            <ul className="text-left text-slate-300 space-y-2 mb-6">
                                <li>✗ FKQ.csv or ratios_for_ml.csv</li>
                                <li>✗ combined_financial_predictions.csv</li>
                                <li>✗ debt_to_equity_predictions.csv</li>
                                <li>✗ financial_kpi_predictions.csv</li>
                            </ul>
                            <button
                                onClick={loadData}
                                className="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg"
                            >
                                Retry Loading
                            </button>
                        </div>
                    </div>
                );
            }

            const stocks = ['all', ...new Set(data.fkq.map(d => d.stock))].sort();
            const filteredData = selectedStock === 'all' ? data.fkq : data.fkq.filter(d => d.stock === selectedStock);

            const calculateMetrics = () => {
                const roeError = data.roe.length > 0 ? data.roe.map(d => Math.abs(d.Actual_ROE - d.Predicted_ROE)) : [0];
                const debtError = data.debt.length > 0 ? data.debt.map(d => Math.abs(d.Actual_Debt_to_Equity - d.Predicted_Debt_to_Equity)) : [0];
                
                const avgROE = filteredData.reduce((sum, d) => sum + (d.roe || 0), 0) / filteredData.length;
                const avgDebt = filteredData.reduce((sum, d) => sum + (d.debt_to_equity || 0), 0) / filteredData.length;
                const avgCurrentRatio = filteredData.reduce((sum, d) => sum + (d.current_ratio || 0), 0) / filteredData.length;
                
                return {
                    avgROE: (avgROE * 100).toFixed(2),
                    avgDebt: avgDebt.toFixed(2),
                    avgCurrentRatio: avgCurrentRatio.toFixed(2),
                    roeMAE: roeError.length > 0 ? (roeError.reduce((a, b) => a + b, 0) / roeError.length).toFixed(4) : 'N/A',
                    debtMAE: debtError.length > 0 ? (debtError.reduce((a, b) => a + b, 0) / debtError.length).toFixed(4) : 'N/A',
                    totalStocks: stocks.length - 1,
                    dataPoints: filteredData.length
                };
            };

            const metrics = calculateMetrics();

            const MetricCard = ({ title, value, icon: Icon, color }) => (
                <div className={`bg-gradient-to-br ${color} p-6 rounded-xl shadow-lg`}>

                        </div>
                    </div>
                </div>
            );

            const renderOverview = () => {
                const timeSeriesData = filteredData
                    .sort((a, b) => new Date(a.enddate) - new Date(b.enddate))
                    .slice(0, 50);

                return (
                    <div className="space-y-6">

                            <div className="bg-yellow-900 border border-yellow-600 rounded-lg p-4">
                                <div className="flex items-center gap-2">
                                    <AlertCircle size={20} />
                                    <p className="text-yellow-200 font-semibold">Missing Files: {missingFiles.join(', ')}</p>
                                </div>
                                <p className="text-yellow-300 text-sm mt-2">Some features may be limited. Upload missing files to see predictions.</p>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            <MetricCard title="Avg ROE" value={`${metrics.avgROE}%`} icon={TrendingUp} color="from-blue-600 to-blue-700" />
                            <MetricCard title="Avg Debt/Equity" value={metrics.avgDebt} icon={Activity} color="from-purple-600 to-purple-700" />
                            <MetricCard title="Avg Current Ratio" value={metrics.avgCurrentRatio} icon={BarChart3} color="from-green-600 to-green-700" />
                            <MetricCard title="Total Stocks" value={metrics.totalStocks} icon={DollarSign} color="from-orange-600 to-orange-700" />
                        </div>

                        <div className="bg-slate-800 rounded-xl p-6 shadow-lg">
                            <h3 className="text-xl font-bold text-white mb-4">Financial Metrics Over Time</h3>
                            <ResponsiveContainer width="100%" height={300}>
                                <LineChart data={timeSeriesData}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                    <XAxis dataKey="enddate" stroke="#9CA3AF" tick={{fontSize: 12}} />
                                    <YAxis stroke="#9CA3AF" />
                                    <Tooltip contentStyle={{backgroundColor: '#1F2937', border: 'none', borderRadius: '8px'}} labelStyle={{color: '#F3F4F6'}} />
                                    <Legend />
                                    <Line type="monotone" dataKey="roe" stroke="#3B82F6" strokeWidth={2} name="ROE" dot={false} />
                                    <Line type="monotone" dataKey="debt_to_equity" stroke="#8B5CF6" strokeWidth={2} name="Debt/Equity" dot={false} />
                                    <Line type="monotone" dataKey="current_ratio" stroke="#10B981" strokeWidth={2} name="Current Ratio" dot={false} />
                                </LineChart>
                            </ResponsiveContainer>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-slate-800 rounded-xl p-6 shadow-lg">
                                <h3 className="text-xl font-bold text-white mb-4">ROE Distribution</h3>
                                <ResponsiveContainer width="100%" height={250}>
                                    <BarChart data={filteredData.slice(0, 30)}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                        <XAxis dataKey="stock" stroke="#9CA3AF" tick={{fontSize: 10}} />
                                        <YAxis stroke="#9CA3AF" />
                                        <Tooltip contentStyle={{backgroundColor: '#1F2937', border: 'none', borderRadius: '8px'}} />
                                        <Bar dataKey="roe" name="ROE">
                                            {filteredData.slice(0, 30).map((entry, index) => (
                                                <Cell key={`cell-${index}`} fill={entry.roe > 0 ? '#10B981' : '#EF4444'} />
                                            ))}
                                        </Bar>
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>

                            <div className="bg-slate-800 rounded-xl p-6 shadow-lg">
                                <h3 className="text-xl font-bold text-white mb-4">Debt to Equity Analysis</h3>
                                <ResponsiveContainer width="100%" height={250}>
                                    <BarChart data={filteredData.slice(0, 30)}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                        <XAxis dataKey="stock" stroke="#9CA3AF" tick={{fontSize: 10}} />
                                        <YAxis stroke="#9CA3AF" />
                                        <Tooltip contentStyle={{backgroundColor: '#1F2937', border: 'none', borderRadius: '8px'}} />
                                        <Bar dataKey="debt_to_equity" fill="#8B5CF6" name="Debt/Equity" />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderPredictions = () => {
                if (data.combined.length === 0) {
                    return (
                        <div className="flex items-center justify-center h-96 bg-slate-800 rounded-xl">
                            <div className="text-center">
                                <div className="mx-auto text-slate-400 mb-4"><Upload size={48} /></div>
                                <p className="text-slate-300 text-lg">Prediction data not available</p>
                                <p className="text-slate-400 text-sm mt-2">Upload the prediction CSV files to view this section</p>
                            </div>
                        </div>
                    );
                }

                const scatterData = data.combined.slice(0, 100).map(d => ({
                    actualROE: d.Actual_ROE,
                    predictedROE: d.Predicted_ROE,
                    actualDebt: d.Actual_Debt_to_Equity,
                    predictedDebt: d.Predicted_Debt_to_Equity,
                    stock: d.stock
                }));

                return (
                    <div className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-slate-800 rounded-xl p-6 shadow-lg">
                                <div className="flex items-center gap-2 mb-4">
                                    <div className="text-blue-400"><AlertCircle size={24} /></div>
                                    <h3 className="text-xl font-bold text-white">Model Performance</h3>
                                </div>
                                <div className="space-y-4">
                                    <div className="bg-slate-700 p-4 rounded-lg">
                                        <p className="text-sm text-slate-300">ROE Mean Absolute Error</p>
                                        <p className="text-2xl font-bold text-blue-400">{metrics.roeMAE}</p>
                                    </div>
                                    <div className="bg-slate-700 p-4 rounded-lg">
                                        <p className="text-sm text-slate-300">Debt/Equity Mean Absolute Error</p>
                                        <p className="text-2xl font-bold text-purple-400">{metrics.debtMAE}</p>
                                    </div>
                                    <div className="bg-slate-700 p-4 rounded-lg">
                                        <p className="text-sm text-slate-300">Prediction Data Points</p>
                                        <p className="text-2xl font-bold text-green-400">{data.combined.length}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-slate-800 rounded-xl p-6 shadow-lg">
                                <h3 className="text-xl font-bold text-white mb-4">Top Prediction Errors (ROE)</h3>
                                <div className="space-y-2 max-h-80 overflow-y-auto">
                                    {data.combined
                                        .map(d => ({ ...d, error: Math.abs(d.Actual_ROE - d.Predicted_ROE) }))
                                        .sort((a, b) => b.error - a.error)
                                        .slice(0, 10)
                                        .map((d, i) => (
                                            <div key={i} className="bg-slate-700 p-3 rounded-lg flex justify-between items-center">
                                                <div>
                                                    <p className="font-semibold text-white">{d.stock}</p>
                                                    <p className="text-sm text-slate-400">{d.enddate}</p>
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-red-400 font-bold">{d.error.toFixed(3)}</p>
                                                    <p className="text-xs text-slate-400">error</p>
                                                </div>
                                            </div>
                                        ))}
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-slate-800 rounded-xl p-6 shadow-lg">
                                <h3 className="text-xl font-bold text-white mb-4">ROE: Actual vs Predicted</h3>
                                <ResponsiveContainer width="100%" height={300}>
                                    <ScatterChart>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                        <XAxis type="number" dataKey="actualROE" name="Actual ROE" stroke="#9CA3AF" label={{ value: 'Actual ROE', position: 'insideBottom', offset: -5, fill: '#9CA3AF' }} />
                                        <YAxis type="number" dataKey="predictedROE" name="Predicted ROE" stroke="#9CA3AF" label={{ value: 'Predicted ROE', angle: -90, position: 'insideLeft', fill: '#9CA3AF' }} />
                                        <Tooltip cursor={{ strokeDasharray: '3 3' }} contentStyle={{backgroundColor: '#1F2937', border: 'none', borderRadius: '8px'}} />
                                        <Scatter data={scatterData} fill="#3B82F6" />
                                    </ScatterChart>
                                </ResponsiveContainer>
                            </div>

                            <div className="bg-slate-800 rounded-xl p-6 shadow-lg">
                                <h3 className="text-xl font-bold text-white mb-4">Debt/Equity: Actual vs Predicted</h3>
                                <ResponsiveContainer width="100%" height={300}>
                                    <ScatterChart>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                        <XAxis type="number" dataKey="actualDebt" name="Actual Debt/Equity" stroke="#9CA3AF" label={{ value: 'Actual Debt/Equity', position: 'insideBottom', offset: -5, fill: '#9CA3AF' }} />
                                        <YAxis type="number" dataKey="predictedDebt" name="Predicted Debt/Equity" stroke="#9CA3AF" label={{ value: 'Predicted Debt/Equity', angle: -90, position: 'insideLeft', fill: '#9CA3AF' }} />
                                        <Tooltip cursor={{ strokeDasharray: '3 3' }} contentStyle={{backgroundColor: '#1F2937', border: 'none', borderRadius: '8px'}} />
                                        <Scatter data={scatterData} fill="#8B5CF6" />
                                    </ScatterChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderAssetAnalysis = () => {
                const assetData = filteredData.slice(0, 20).map(d => ({
                    stock: d.stock,
                    totalassets: d.totalassets / 1000000,
                    cash: d.cash / 1000000,
                    inventory: d.inventory / 1000000,
                    netreceivables: d.netreceivables / 1000000,
                    longtermdebt: d.longtermdebt / 1000000
                }));

                return (
                    <div className="space-y-6">
                        <div className="bg-slate-800 rounded-xl p-6 shadow-lg">
                            <h3 className="text-xl font-bold text-white mb-4">Asset Composition (in millions)</h3>
                            <ResponsiveContainer width="100%" height={400}>
                                <BarChart data={assetData}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                    <XAxis dataKey="stock" stroke="#9CA3AF" tick={{fontSize: 11}} />
                                    <YAxis stroke="#9CA3AF" label={{ value: 'Amount ($M)', angle: -90, position: 'insideLeft', fill: '#9CA3AF' }} />
                                    <Tooltip contentStyle={{backgroundColor: '#1F2937', border: 'none', borderRadius: '8px'}} formatter={(value) => `$${value.toFixed(2)}M`} />
                                    <Legend />
                                    <Bar dataKey="cash" stackId="a" fill="#10B981" name="Cash" />
                                    <Bar dataKey="inventory" stackId="a" fill="#3B82F6" name="Inventory" />
                                    <Bar dataKey="netreceivables" stackId="a" fill="#8B5CF6" name="Net Receivables" />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-slate-800 rounded-xl p-6 shadow-lg">
                                <h3 className="text-xl font-bold text-white mb-4">Total Assets vs Long-term Debt</h3>
                                <ResponsiveContainer width="100%" height={300}>
                                    <ScatterChart>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                        <XAxis type="number" dataKey="totalassets" name="Total Assets" stroke="#9CA3AF" label={{ value: 'Total Assets ($M)', position: 'insideBottom', offset: -5, fill: '#9CA3AF' }} />
                                        <YAxis type="number" dataKey="longtermdebt" name="Long-term Debt" stroke="#9CA3AF" label={{ value: 'Long-term Debt ($M)', angle: -90, position: 'insideLeft', fill: '#9CA3AF' }} />
                                        <Tooltip cursor={{ strokeDasharray: '3 3' }} contentStyle={{backgroundColor: '#1F2937', border: 'none', borderRadius: '8px'}} formatter={(value) => `$${value.toFixed(2)}M`} />
                                        <Scatter data={assetData} fill="#F59E0B" />
                                    </ScatterChart>
                                </ResponsiveContainer>
                            </div>

                            <div className="bg-slate-800 rounded-xl p-6 shadow-lg">
                                <h3 className="text-xl font-bold text-white mb-4">Current Ratio Distribution</h3>
                                <ResponsiveContainer width="100%" height={300}>
                                    <BarChart data={filteredData.slice(0, 25)}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                        <XAxis dataKey="stock" stroke="#9CA3AF" tick={{fontSize: 10}} />
                                        <YAxis stroke="#9CA3AF" />
                                        <Tooltip contentStyle={{backgroundColor: '#1F2937', border: 'none', borderRadius: '8px'}} />
                                        <Bar dataKey="current_ratio" name="Current Ratio">
                                            {filteredData.slice(0, 25).map((entry, index) => (
                                                <Cell key={`cell-${index}`} fill={entry.current_ratio > 1.5 ? '#10B981' : '#F59E0B'} />
                                            ))}
                                        </Bar>
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-900 p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="mb-8">
                            <h1 className="text-4xl font-bold text-white mb-2">Financial Analytics Dashboard</h1>
                            <p className="text-slate-400">Comprehensive analysis of financial KPIs and predictions</p>
                        </div>

                        <div className="mb-6 flex flex-wrap gap-4 items-center">
                            <div className="flex-1 min-w-64">
                                <label className="block text-sm font-medium text-slate-300 mb-2">Select Stock</label>
                                <select
                                    value={selectedStock}
                                    onChange={(e) => setSelectedStock(e.target.value)}
                                    className="w-full bg-slate-800 text-white rounded-lg px-4 py-2 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                >
                                    {stocks.map(stock => (
                                        <option key={stock} value={stock}>
                                            {stock === 'all' ? 'All Stocks' : stock}
                                        </option>
                                    ))}
                                </select>
                            </div>

                            <div className="flex gap-2">
                                <button
                                    onClick={() => setActiveTab('overview')}
                                    className={`px-6 py-2 rounded-lg font-medium transition-colors ${
                                        activeTab === 'overview'
                                            ? 'bg-blue-600 text-white'
                                            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                    }`}
                                >
                                    Overview
                                </button>
                                <button
                                    onClick={() => setActiveTab('predictions')}
                                    className={`px-6 py-2 rounded-lg font-medium transition-colors ${
                                        activeTab === 'predictions'
                                            ? 'bg-blue-600 text-white'
                                            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                    }`}
                                >
                                    Predictions
                                </button>
                                <button
                                    onClick={() => setActiveTab('assets')}
                                    className={`px-6 py-2 rounded-lg font-medium transition-colors ${
                                        activeTab === 'assets'
                                            ? 'bg-blue-600 text-white'
                                            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                    }`}
                                >
                                    Assets
                                </button>
                            </div>
                        </div>

                        {activeTab === 'overview' && renderOverview()}
                        {activeTab === 'predictions' && renderPredictions()}
                        {activeTab === 'assets' && renderAssetAnalysis()}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<FinancialDashboard />, document.getElementById('root'));
    </script>
